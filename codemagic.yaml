workflows:
  ios-native:
    name: VA-ECMO Simulator iOS
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest

      ios_signing:
        distribution_type: development
        bundle_identifier: com.vaecmo.simulator

    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate Xcode project
        script: |
          xcodegen generate

      - name: Set up iOS signing
        script: |
          xcode-project use-profiles

      - name: Build iOS app
        script: |
          xcodebuild \
            -project "VA Simulator.xcodeproj" \
            -scheme "VA Simulator" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/VA-Simulator.xcarchive \
            archive

      - name: Export IPA
        script: |
          xcode-project build-ipa \
            --project "VA Simulator.xcodeproj" \
            --scheme "VA Simulator" \
            --archive-flags "-archivePath build/VA-Simulator.xcarchive"

    artifacts:
      - build/ios/ipa/*.ipa
      - build/**/*.xcarchive
