workflows:
  ios-native:
    name: VA-ECMO Simulator iOS
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest
      ios_signing:
        distribution_type: development
        bundle_identifier: com.vaecmo.simulator

    scripts:
      - name: Build iOS app
        script: |
          xcodebuild \
            -project "VA Simulator.xcodeproj" \
            -scheme "VA Simulator" \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

    artifacts:
      - build/ios/iphoneos/*.app
